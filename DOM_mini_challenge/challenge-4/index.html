<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project 05: Image Slider</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="slider">
        <!-- Previous Button -->
        <button class="slider-btn prev-btn" id="prevBtn">
          <span>&#10094;</span>
        </button>

        <!-- Slider Container -->
        <div class="slider-container">
          <img id="sliderImage" src="" alt="Slider Image" />

          <div class="slideCounter" id="slideCounter">1 / 5</div>
        </div>

        <!-- Next Button -->
        <button class="slider-btn next-btn" id="nextBtn">
          <span>&#10095;</span>
        </button>
      </div>
    </div>
  </body>
</html>
